        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: get_ip
      name: Get EC2 IP
      run: echo "ec2_ip=$(terraform output -raw elastic_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
    - name: Install Ansible
      run: pip install ansible-core ansible
    - name: Install Ansible collections
      run: ansible-galaxy collection install community.general community.docker
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "${{ steps.get_ip.outputs.ec2_ip }}" >> ~/.ssh/known_hosts

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Generate inventory
      run: 'cat > /tmp/inventory.ini <<EOF

        [idp_servers]

        ${{ steps.get_ip.outputs.ec2_ip }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/deploy_key
        ansible_ssh_common_args=''-o StrictHostKeyChecking=accept-new''

        EOF

        '
    - name: Run Ansible playbook
      run: "ansible-playbook -i /tmp/inventory.ini ansible/site.yml \\\n  --extra-vars\
        \ \"docker_image=ghcr.io/${{ github.repository_owner }}/internal-developer-portal:${{\
