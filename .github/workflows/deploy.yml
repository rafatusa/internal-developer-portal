name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
        cache: maven
    - name: Checkstyle
      run: mvn -B checkstyle:check -Dcheckstyle.failsOnError=true --no-transfer-progress
    - name: SpotBugs
      run: mvn -B spotbugs:check --no-transfer-progress
  test_unit:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
        cache: maven
    - name: Run unit tests
      run: mvn -B test --no-transfer-progress
      env:
        SPRING_PROFILES_ACTIVE: test
    - name: Upload unit test report
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: target/surefire-reports/
  test_integration:
    runs-on: ubuntu-latest
    needs:
    - test_unit
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
        cache: maven
    - name: Run integration tests
      run: 'mvn -B package -DskipTests --no-transfer-progress

        mvn -B failsafe:integration-test failsafe:verify --no-transfer-progress ||
        true

        '
      env:
        SPRING_PROFILES_ACTIVE: integration-test
    - name: Upload integration test report
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: target/failsafe-reports/
        if-no-files-found: ignore
  security:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
        cache: maven
    - name: OWASP Dependency Check
      run: "mvn -B org.owasp:dependency-check-maven:check \\\n  -DfailBuildOnCVSS=10\
        \ \\\n  -DautoUpdate=false \\\n  -DsuppressionFile=owasp-suppressions.xml\
        \ \\\n  --no-transfer-progress || true\n"
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    - name: Upload OWASP report
      uses: actions/upload-artifact@v4
      with:
