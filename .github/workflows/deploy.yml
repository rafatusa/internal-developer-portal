        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: get_ip
      name: Get EC2 IP
      run: echo "ec2_ip=$(terraform output -raw elastic_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "${{ steps.get_ip.outputs.ec2_ip }}" >> ~/.ssh/known_hosts

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Install Puppet agent on server
      run: "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \\\n  ${{\
        \ secrets.SSH_USER }}@${{ steps.get_ip.outputs.ec2_ip }} \\\n  'wget -q https://apt.puppetlabs.com/puppet8-release-jammy.deb\
        \ && \\\n   sudo dpkg -i puppet8-release-jammy.deb && \\\n   sudo apt-get\
        \ update -q && \\\n   sudo apt-get install -y puppet-agent && \\\n   sudo\
        \ /opt/puppetlabs/bin/puppet --version'\n"
    - name: Copy Puppet manifests to server
      run: "scp -i ~/.ssh/deploy_key -r puppet/ \\\n  ${{ secrets.SSH_USER }}@${{\
        \ steps.get_ip.outputs.ec2_ip }}:/tmp/puppet_manifests\n"
    - name: Apply Puppet bootstrap manifest
      run: "ssh -i ~/.ssh/deploy_key \\\n  ${{ secrets.SSH_USER }}@${{ steps.get_ip.outputs.ec2_ip\
        \ }} \\\n  'sudo /opt/puppetlabs/bin/puppet apply /tmp/puppet_manifests/manifests/site.pp\
        \ \\\n   --modulepath=/tmp/puppet_manifests/modules 2>&1'\n"
  configure:
