version: 1
name: internal-developer-portal
vcs: github

rollback:
  strategy: manual

stages:
  # ── Stage 1: Lint & Style ────────────────────────────────────────────────
  - id: lint
    kind: lint
    timeout_minutes: 15
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Checkstyle
        run: mvn -B checkstyle:check -Dcheckstyle.failsOnError=true --no-transfer-progress
      - name: SpotBugs
        run: mvn -B spotbugs:check --no-transfer-progress

  # ── Stage 2: Unit Tests ──────────────────────────────────────────────────
  - id: test_unit
    kind: test
    needs: [lint]
    timeout_minutes: 20
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Run unit tests
        run: mvn -B test -Dspring.profiles.active=test --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test
      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/surefire-reports/

  # ── Stage 3: Integration Tests ───────────────────────────────────────────
  - id: test_integration
    kind: test
    needs: [test_unit]
    timeout_minutes: 30
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Run integration tests
        run: mvn -B verify -DskipTests=true --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: integration-test
      - name: Upload integration test report
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/failsafe-reports/

  # ── Stage 4: Security Scan ───────────────────────────────────────────────
  - id: security
    kind: security
    needs: [lint]
    timeout_minutes: 30
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: OWASP Dependency Check
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "NVD_API_KEY not set — running OWASP with autoUpdate=false (report only, no block)"
            mvn -B org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=10 \
              -DautoUpdate=false \
              -DsuppressionFile=owasp-suppressions.xml \
              --no-transfer-progress || true
          else
            echo "NVD_API_KEY present — running full OWASP scan with live NVD data"
            mvn -B org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=10 \
              -DautoUpdate=true \
              -DnvdApiKey="${NVD_API_KEY}" \
              -DsuppressionFile=owasp-suppressions.xml \
              --no-transfer-progress || true
          fi
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  # ── Stage 5: Build & Push Docker Image ──────────────────────────────────
  - id: build_push
    kind: build_push
    needs: [test_unit, test_integration, security]
    timeout_minutes: 20
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build Maven artifact
        run: mvn -B package -DskipTests --no-transfer-progress
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/internal-developer-portal:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/internal-developer-portal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 6: Provision AWS Infrastructure ───────────────────────────────
  - id: provision
    kind: provision
    needs: [build_push]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Terraform Validate
        run: terraform validate
        working-directory: infra
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: infra
      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        working-directory: infra
      - name: Capture EC2 IP
        id: tf_outputs
        run: |
          echo "ec2_ip=$(terraform output -raw elastic_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra

  # ── Stage 7: Puppet Bootstrap ────────────────────────────────────────────
  - id: puppet_bootstrap
    kind: custom
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set up Terraform (for output read)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform Init (read state)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Get EC2 IP
        id: get_ip
        run: echo "ec2_ip=$(terraform output -raw elastic_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ steps.get_ip.outputs.ec2_ip }}" >> ~/.ssh/known_hosts
      - name: Install Puppet agent on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            ${{ secrets.SSH_USER }}@${{ steps.get_ip.outputs.ec2_ip }} \
            'wget -q https://apt.puppetlabs.com/puppet8-release-jammy.deb && \
             sudo dpkg -i puppet8-release-jammy.deb && \
             sudo apt-get update -q && \
             sudo apt-get install -y puppet-agent && \
             sudo /opt/puppetlabs/bin/puppet --version'
      - name: Copy Puppet manifests to server
        run: |
          scp -i ~/.ssh/deploy_key -r puppet/ \
            ${{ secrets.SSH_USER }}@${{ steps.get_ip.outputs.ec2_ip }}:/tmp/puppet_manifests
      - name: Apply Puppet bootstrap manifest
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ steps.get_ip.outputs.ec2_ip }} \
            'sudo /opt/puppetlabs/bin/puppet apply /tmp/puppet_manifests/manifests/site.pp \
             --modulepath=/tmp/puppet_manifests/modules 2>&1'

  # ── Stage 8: Ansible Deployment ─────────────────────────────────────────
  - id: configure
    kind: configure
    needs: [puppet_bootstrap]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set up Terraform (for output read)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform Init (read state)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Get EC2 IP
        id: get_ip
        run: echo "ec2_ip=$(terraform output -raw elastic_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Install Ansible
        run: pip install ansible-core ansible
      - name: Install Ansible collections
        run: ansible-galaxy collection install community.general community.docker
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ steps.get_ip.outputs.ec2_ip }}" >> ~/.ssh/known_hosts
      - name: Generate inventory
        run: |
          cat > /tmp/inventory.ini <<EOF
          [idp_servers]
          ${{ steps.get_ip.outputs.ec2_ip }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/deploy_key ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
          EOF
      - name: Run Ansible playbook
        run: |
          ansible-playbook -i /tmp/inventory.ini ansible/site.yml \
            --extra-vars "docker_image=ghcr.io/${{ github.repository_owner }}/internal-developer-portal:${{ github.sha }}" \
            --extra-vars "db_password=${{ secrets.DB_PASSWORD }}" \
            --extra-vars "jwt_secret=${{ secrets.JWT_SECRET }}" \
            --extra-vars "github_token=${{ secrets.GITHUB_TOKEN }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "1"

  # ── Stage 9: Health Check Verification ──────────────────────────────────
  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set up Terraform (for output read)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform Init (read state)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Get EC2 IP
        id: get_ip
        run: echo "ec2_ip=$(terraform output -raw elastic_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Wait for application health
        run: |
          echo "Waiting for /actuator/health on http://${{ steps.get_ip.outputs.ec2_ip }}/actuator/health ..."
          curl --fail --retry 20 --retry-delay 15 --retry-all-errors \
            http://${{ steps.get_ip.outputs.ec2_ip }}/actuator/health
      - name: Print deployment summary
        run: |
          echo "========================================="
          echo " Internal Developer Portal - DEPLOYED"
          echo "========================================="
          echo " URL: http://${{ steps.get_ip.outputs.ec2_ip }}"
          echo " API: http://${{ steps.get_ip.outputs.ec2_ip }}/api/v1"
          echo " Swagger: http://${{ steps.get_ip.outputs.ec2_ip }}/swagger-ui.html"
          echo " Health: http://${{ steps.get_ip.outputs.ec2_ip }}/actuator/health"
          echo " Image: ghcr.io/${{ github.repository_owner }}/internal-developer-portal:${{ github.sha }}"
          echo "========================================="

destroy:
  steps:
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.8"
    - name: Terraform Init
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=us-east-1"
      working-directory: infra
    - name: Terraform Destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: infra
      env:
        TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
        TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
