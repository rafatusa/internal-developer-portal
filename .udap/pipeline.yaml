version: 1
name: internal-developer-portal
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Checkstyle
        run: mvn checkstyle:check -f pom.xml
      - name: SpotBugs
        run: mvn spotbugs:check -f pom.xml

  - id: test
    kind: test
    needs: [lint]
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Unit tests
        run: mvn test -f pom.xml
      - name: Integration tests
        run: mvn verify -Pfailsafe -f pom.xml

  - id: security
    kind: security
    needs: [lint]
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: OWASP dependency check
        run: mvn org.owasp:dependency-check-maven:check -f pom.xml

  - id: build_push
    kind: build_push
    needs: [test, security]
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build JAR
        run: mvn package -DskipTests -f pom.xml
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest

  - id: provision
    kind: provision
    needs: [build_push]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

  - id: puppet-bootstrap
    kind: custom
    needs: [provision]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Get instance IP
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Wait for SSH
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
        run: |
          for i in $(seq 1 20); do
            ssh -i ~/.ssh/deploy_key -o ConnectTimeout=5 -o BatchMode=yes \
              "$DEPLOY_USER@$HOST" echo "ready" && break
            echo "Attempt $i: SSH not ready, retrying in 15s..."
            sleep 15
          done
      - name: Copy Puppet manifests
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
        run: scp -i ~/.ssh/deploy_key -r puppet/ "$DEPLOY_USER@$HOST:/tmp/puppet-manifests"
      - name: Run Puppet bootstrap
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$HOST" \
            "sudo DEPLOY_USER=$DEPLOY_USER bash /tmp/puppet-manifests/bootstrap.sh"

  - id: configure
    kind: configure
    needs: [puppet-bootstrap]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Get instance IP
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Install Ansible
        run: |
          pipx install ansible-core
          ansible --version
      - name: Run Ansible playbook
        working-directory: ansible
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          ansible-playbook playbook.yml \
            -i "$HOST," \
            --private-key ~/.ssh/deploy_key \
            -u "$DEPLOY_USER" \
            -e "db_password=$DB_PASSWORD" \
            -e "jwt_secret=$JWT_SECRET" \
            -e "admin_username=admin" \
            -e "admin_password=$ADMIN_PASSWORD" \
            -e "image_tag=$IMAGE_TAG" \
            -e "ghcr_user=$GHCR_USER" \
            -e "ghcr_token=$GHCR_TOKEN" \
            -e "repo=$REPO"

  - id: verify
    kind: verify
    needs: [configure]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Get instance IP
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Health check
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: |
          curl --fail --retry 12 --retry-delay 15 --retry-all-errors \
            "http://$HOST/actuator/health"
      - name: Verify OpenAPI document is served
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: |
          curl --fail --retry 6 --retry-delay 10 --retry-all-errors \
            "http://$HOST/v3/api-docs" -o openapi.json
          echo "OpenAPI document retrieved ($(wc -c < openapi.json) bytes)"
      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json

  - id: perf
    kind: perf
    needs: [verify]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Get instance IP
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -o k6.tar.gz
          tar xzf k6.tar.gz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Run k6 performance tests
        env:
          BASE_URL: http://${{ steps.get_ip.outputs.ip }}
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: k6 run tests/k6/performance.js
      - name: Upload k6 summary
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-summary
          path: k6-summary.json

rollback:
  strategy: manual
