# Ansible inventory — populated dynamically by the CI configure stage
# from terraform output instance_public_ip
[idp_servers]
# HOST_PLACEHOLDER — replaced by CI: ansible-playbook ... -i "${HOST},"

[idp_servers:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/deploy_key
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30
ansible_python_interpreter=/usr/bin/python3
