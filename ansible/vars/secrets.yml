# ansible/vars/secrets.yml
# These variables are injected from CI environment variables at deploy time.
# In production use ansible-vault encrypt_string for values.
# Values below are placeholders — real values come from GitHub Secrets via the CI pipeline.

db_host: "{{ lookup('env', 'DB_HOST') }}"
db_port: "{{ lookup('env', 'DB_PORT') | default('5432', true) }}"
db_name: "{{ lookup('env', 'DB_NAME') | default('idpdb', true) }}"
db_username: "{{ lookup('env', 'DB_USERNAME') | default('idpuser', true) }}"
db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
jwt_secret: "{{ lookup('env', 'JWT_SECRET') }}"
ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
app_image: "{{ lookup('env', 'APP_IMAGE') }}"
spring_profile: "production"
