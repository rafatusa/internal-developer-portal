spring:
  # DataSource connection coordinates are overridden at runtime by
  # BaseIntegrationTest @DynamicPropertySource with the Testcontainers PostgreSQL port.
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

app:
  jwt:
    # HS512 requires ≥ 64 bytes (512 bits / 8) — WeakKeyException crashes context if shorter
    secret: integration-test-jwt-secret-key-exactly-64-chars-long-for-hs512x
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

logging:
  level:
    root: WARN
    com.enterprise.idp: INFO
    org.flywaydb: INFO
    org.testcontainers: INFO
