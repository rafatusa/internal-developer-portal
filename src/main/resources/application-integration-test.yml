spring:
  # DataSource is set dynamically by Testcontainers @DynamicPropertySource
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    validate-on-migrate: true

app:
  jwt:
    secret: integration-test-jwt-secret-key-must-be-at-least-32-chars-for-hs256
    expiration-ms: 86400000

logging:
  level:
    root: WARN
    com.enterprise.idp: INFO
    org.flywaydb: INFO
