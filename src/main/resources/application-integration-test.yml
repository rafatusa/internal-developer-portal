spring:
  # DataSource is set dynamically by Testcontainers @DynamicPropertySource
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    validate-on-migrate: true

app:
  jwt:
    # HS512 requires ≥ 64 bytes — this secret is exactly 64 chars
    secret: integration-test-jwt-secret-key-exactly-64-chars-long-for-hs512x
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

logging:
  level:
    root: WARN
    com.enterprise.idp: INFO
    org.flywaydb: INFO
