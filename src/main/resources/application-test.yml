spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    # HS512 requires ≥ 64 bytes — this secret is exactly 64 chars
    secret: unit-test-jwt-secret-key-exactly-64-characters-long-for-hs512-ok!
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

logging:
  level:
    root: WARN
    com.enterprise.idp: INFO
