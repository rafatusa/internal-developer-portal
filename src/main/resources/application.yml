spring:
  application:
    name: internal-developer-portal

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/idp}
    username: ${DB_USERNAME:idp}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-in-production-0123456789}
    expiration-ms: 3600000
    issuer: internal-developer-portal
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123456}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.example.internaldeveloperportal: INFO
    org.springframework.security: WARN
