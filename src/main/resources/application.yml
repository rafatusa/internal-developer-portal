spring:
  application:
    name: internal-developer-portal

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:idpdb}
    username: ${DB_USERNAME:idpuser}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

app:
  jwt:
    secret: ${JWT_SECRET:your-very-long-secret-key-must-be-at-least-256-bits-for-hs256-algorithm}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  security:
    # BCrypt cost factor. Production: 12 (~300ms/hash — brute-force resistant).
    # Integration tests override to 4 (~5ms/hash) via application-integration-test.yml
    # to avoid Tomcat 60s request timeout on slow CI runners.
    bcrypt-strength: 12

info:
  app:
    name: Internal Developer Portal
    version: 1.0.0
    description: Enterprise Internal Developer Portal API

logging:
  level:
    root: INFO
    com.enterprise.idp: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
