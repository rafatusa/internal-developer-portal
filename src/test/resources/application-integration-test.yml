# Integration-test profile — loaded by @ActiveProfiles("integration-test") in BaseIntegrationTest.
# The datasource URL/username/password are overridden at runtime by @DynamicPropertySource
# with the actual Testcontainers PostgreSQL coordinates. Everything else is static here.

spring:
  datasource:
    # Placeholder — overridden by @DynamicPropertySource before the context starts
    url: jdbc:postgresql://localhost:5432/idpdb_test
    username: idpuser
    password: testpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 0   # random port — @LocalServerPort picks it up

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT — HS512 requires >= 64 bytes (512 bits).
# This secret is exactly 88 characters = 88 bytes (ASCII) — safely above the 64-byte minimum.
app:
  jwt:
    secret: "integration-test-jwt-signing-secret-for-hs512-algorithm-must-be-at-least-64-bytes-long!!"
    expiration-ms: 3600000          # 1 hour — short for tests
    refresh-expiration-ms: 7200000  # 2 hours

logging:
  level:
    root: WARN
    com.enterprise.idp: INFO
    org.flywaydb: INFO
