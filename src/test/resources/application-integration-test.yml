spring:
  datasource:
    url: jdbc:h2:mem:idptest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=value;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    url: jdbc:h2:mem:idptest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=value;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    user: sa
    password: ""

  h2:
    console:
      enabled: false

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: integrationtestjwtsigningsecretforhs512algorithmmustbeatleast64byteslongabcdefgh
    expiration-ms: 3600000
    refresh-expiration-ms: 7200000
  security:
    bcrypt-strength: 4

# Keep logging at ERROR to avoid the Spring conditions report flooding the output
# and truncating the actual test failure messages in the sandbox.
logging:
  level:
    root: ERROR
    com.enterprise.idp: WARN
