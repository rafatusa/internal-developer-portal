# Integration-test profile — loaded by @ActiveProfiles("integration-test") in BaseIntegrationTest.
#
# Datasource coordinates are NOT set here — @ServiceConnection on the @Container in
# BaseIntegrationTest wires the Testcontainers PostgreSQL URL/user/password directly into
# ALL Spring Boot auto-configuration (DataSource AND Flyway) before the context starts.
# Setting them here would be overridden anyway, but omitting them avoids any ordering race.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 0   # random port — @LocalServerPort picks it up

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT — HS512 requires >= 64 bytes (512 bits).
# This secret is exactly 88 characters = 88 bytes (ASCII) — safely above the 64-byte minimum.
app:
  jwt:
    secret: "integration-test-jwt-signing-secret-for-hs512-algorithm-must-be-at-least-64-bytes-long!!"
    expiration-ms: 3600000          # 1 hour — short for tests
    refresh-expiration-ms: 7200000  # 2 hours

logging:
  level:
    root: WARN
    com.enterprise.idp: INFO
    org.flywaydb: INFO
