# Integration-test profile — loaded by @ActiveProfiles("integration-test") in BaseIntegrationTest.
#
# Datasource coordinates are NOT declared here.
# @ServiceConnection on the static PostgreSQLContainer in BaseIntegrationTest
# wires the Testcontainers-assigned JDBC URL, username, password, and driver
# into Spring Boot's DataSource AND Flyway auto-configuration before the
# context starts — overriding any spring.datasource.* from application.yml.
#
# spring-boot-testcontainers artifact is on the test classpath (pom.xml) which
# provides the @ServiceConnection annotation.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT — HS512 requires exactly 64+ bytes.
# 80 pure alphanumeric chars = 80 bytes. No special chars, no YAML escape issues.
app:
  jwt:
    secret: "integrationtestjwtsigningsecretforhs512algorithmmustbeatleast64byteslong1234567890ab"
    expiration-ms: 3600000
    refresh-expiration-ms: 7200000

logging:
  level:
    root: WARN
    com.enterprise.idp: INFO
    org.flywaydb: INFO
    org.testcontainers: INFO
