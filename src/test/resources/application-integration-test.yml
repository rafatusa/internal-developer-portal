# Integration-test profile — loaded by @ActiveProfiles("integration-test") in BaseIntegrationTest.
#
# @ServiceConnection on the static PostgreSQLContainer wires the Testcontainers-assigned
# JDBC URL, username, password and driver into Spring Boot's DataSource AND Flyway
# auto-configuration before the context starts.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT — 80 pure alphanumeric chars = 80 bytes, safely above the 64-byte HS512 minimum.
app:
  jwt:
    secret: "integrationtestjwtsigningsecretforhs512algorithmmustbeatleast64byteslong1234567890ab"
    expiration-ms: 3600000
    refresh-expiration-ms: 7200000
  security:
    # BCrypt cost 4 (~5ms/hash) instead of production cost 12 (~300ms/hash).
    # Prevents Tomcat 60s request timeout when register+login each do
    # multiple encode/matches calls in @BeforeEach on slow CI runners.
    bcrypt-strength: 4

logging:
  level:
    root: WARN
    com.enterprise.idp: INFO
    org.flywaydb: INFO
    org.testcontainers: INFO
