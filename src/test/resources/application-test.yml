spring:
  datasource:
    url: jdbc:h2:mem:idp-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

app:
  jwt:
    secret: test-secret-key-for-unit-and-integration-tests-only-0123456789abcdef
    expiration-ms: 3600000
    issuer: internal-developer-portal
  bootstrap:
    admin-username: admin
    admin-password: admin123456

logging:
  level:
    root: WARN
    com.example.internaldeveloperportal: INFO
