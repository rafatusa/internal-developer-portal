# Unit-test profile — loaded by -Dspring.profiles.active=test in the test_unit CI stage.
# Uses H2 in-memory database so no external PostgreSQL is needed for unit tests.

spring:
  datasource:
    url: jdbc:h2:mem:idpdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false   # Flyway uses PostgreSQL DDL; H2 schema is created by Hibernate create-drop

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health

# JWT — HS512 requires >= 64 bytes (512 bits).
# This secret is 88 characters = 88 bytes (ASCII) — safely above the 64-byte minimum.
app:
  jwt:
    secret: "unit-test-jwt-signing-secret-key-for-hs512-algorithm-which-needs-64-bytes-minimum-here!!"
    expiration-ms: 3600000
    refresh-expiration-ms: 7200000

logging:
  level:
    root: WARN
    com.enterprise.idp: INFO
