spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DATABASE_TO_UPPER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        # Override base application.yml PostgreSQLDialect for H2 unit tests
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    # HS512 requires >= 64 bytes — this secret is exactly 64 alphanumeric chars
    secret: unittestjwtsigningsecretforhs512algorithmmustbeatleast64byteslong12
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  security:
    bcrypt-strength: 4

logging:
  level:
    root: WARN
    com.enterprise.idp: INFO
